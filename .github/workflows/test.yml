name: V1 release gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        shell: pwsh
        run: ./scripts/setup.ps1 -Python python
      - name: Run all checks with STO last
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            docs/TEST_RESULTS.json
            docs/python-tests.xml
            frontend/playwright-report/
