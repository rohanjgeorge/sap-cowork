[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-cowork"
version = "0.1.0"
description = "Project-scoped SAP SDLC orchestration workspace"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "httpx>=0.28,<1", "keyring>=25,<26", "filelock>=3.16,<4", "python-multipart>=0.0.20", "python-docx>=1.1,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
models = ["litellm>=1.70,<2"]

[project.scripts]
cowork = "cli.main:app"

[tool.setuptools.packages.find]
include = ["backend*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "cli/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
